[package]
name = "cp-companion"
version = "3.1.5"
description = "A Tauri App"
authors = ["Siddhart Paul", "Mradul Gupta"]
edition = "2021"

[lib]
name = "cp_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
tauri-plugin-single-instance = "2.4.2"
windows = { version = "0.58", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "System", "Win32_Storage_Packaging_Appx"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.58", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation", "Win32_System_WinRT", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
